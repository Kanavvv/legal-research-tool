 rights:[
  {cls:"",html:`<div class="kick">If you're arrested</div><div class="grow"></div><h1>6 rights<br>the police<br>must <em>respect.</em></h1><div class="grow"></div><p class="mut">Under the BNSS, which replaced the CrPC in 2024.</p>`},
  {cls:"",html:`<div class="num">1</div><h2>To know why</h2><p>The police must tell you the grounds of your arrest, and for a bailable offence, that you can get bail.</p><div class="cite">BNSS s.47 · Constitution Art. 22(1)</div>`},
  {cls:"",html:`<div class="num">2</div><h2>To tell someone</h2><p>The police must inform a relative or friend you name about the arrest and where you're being held.</p><div class="cite">BNSS s.48</div>`},

  {cls:"",html:`<div class="kick">What happened</div><h2>A passport, taken.</h2><p>The government impounded Maneka Gandhi's passport "in the public interest" and refused to tell her why.</p><p class="mut">She challenged it in the Supreme Court.</p>`},

  {cls:"",html:`<div class="num">1</div><h2>Any police station</h2><p>For a cognizable offence, you can report it at any station, even outside the area where it happened (a "Zero FIR"). You can also report it electronically.</p><div class="cite">BNSS s.173(1)</div>`},

  {cls:"",html:`<div class="kick">What it is</div><h2>Bail before arrest</h2><p>If you fear arrest for a non-bailable offence, you can ask the court in advance: if arrested, release me on bail.</p>`},

  {cls:"",html:`<div class="num">1</div><h2>Up to ₹50 lakh: District</h2><p>Claims up to ₹50 lakh go to the District Commission (the limit set in 2021). Bigger claims go to the State or National Commission.</p><div class="cite">Consumer Protection Act s.34</div>`},

  {cls:"",html:`<div class="kick">Your rights · cheque bounce</div><div class="grow"></div><h1>Cheque<br>bounced?<br><em>Watch the clock.</em></h1><div class="grow"></div><p class="mut">Negotiable Instruments Act, 1881. Miss a deadline and the case can fail.</p>`},
  {cls:"",html:`<div class="num">30</div><h2>days to send notice</h2><p>Send a written demand notice to the person who gave the cheque within 30 days of the bank's return memo.</p><div class="cite">NI Act s.138</div>`},

 tenant:[
  {cls:"",html:`<div class="kick">Your rights · renting</div><div class="grow"></div><h1>Renting?<br>5 things<br><em>to know.</em></h1><div class="grow"></div><p class="mut">Rent law is mostly state law, so details vary. These points hold across India.</p>`},
  {cls:"",html:`<div class="num">1</div><h2>Why 11 months</h2><p>A lease for a year or more must be in writing and registered. That is why many agreements are for 11 months.</p><div class="cite">Transfer of Property Act s.107</div>`},
  {cls:"",html:`<div class="num">2</div><h2>15 days' notice</h2><p>Without a written term, a monthly tenancy ends with 15 days' notice.</p><div class="cite">Transfer of Property Act s.106</div>`},
  {cls:"",html:`<div class="num">3</div><h2>No lock-outs</h2><p>A landlord must go through the court or rent authority to evict you. Changing locks, removing your things or cutting water and power is not the lawful route.</p><div class="cite">Your state's rent law sets the details</div>`},

  {cls:"",html:`<div class="kick">Your rights · bail</div><div class="grow"></div><h1>Bail is<br>the rule.<br><em>Jail, the exception.</em></h1><div class="grow"></div><p class="mut">4 bail rules in the BNSS, which replaced the CrPC.</p>`},
  {cls:"",html:`<div class="num">1</div><h2>Bailable? It's your right.</h2><p>For a bailable offence, the police or court must release you once you give bail or a bond.</p><div class="cite">BNSS s.478</div>`},
  {cls:"",html:`<div class="num">2</div><h2>Non-bailable? The court decides.</h2><p>It looks at the offence, the evidence, and whether you might flee or tamper with evidence.</p><div class="cite">BNSS s.480</div>`},
  {cls:"",html:`<div class="num">3</div><h2>“Default” bail</h2><p>If the police don't file the chargesheet within 60 or 90 days (depending on the offence), you can claim bail.</p><div class="cite">BNSS s.187</div>`},

 firhindi:[

  {cls:"hi",html:`<div class="num">1</div><h2>कोई भी थाना</h2><p>आप किसी भी थाने में रिपोर्ट कर सकते हैं, चाहे अपराध कहीं भी हुआ हो ("ज़ीरो FIR")। फिर उसे सही थाने भेजा जाता है।</p><div class="cite">BNSS s.173(1)</div>`},
  {cls:"hi",html:`<div class="num">2</div><h2>मौखिक या ऑनलाइन</h2><p>आप जानकारी मौखिक रूप से या इलेक्ट्रॉनिक तरीक़े से दे सकते हैं। इलेक्ट्रॉनिक रिपोर्ट पर तीन दिन के भीतर आपके हस्ताक्षर ज़रूरी हैं।</p><div class="cite">BNSS s.173(1)</div>`},

  {cls:"hi",html:`<div class="num">4</div><h2>मना करें, तो SP</h2><p>अगर थाना मना करे, तो शिकायत लिखकर डाक से पुलिस अधीक्षक (SP) को भेजें।</p><div class="cite">BNSS s.173(4)</div>`},
  {cls:"hi",html:`<div class="num">5</div><h2>फिर मजिस्ट्रेट</h2><p>इससे भी काम न बने, तो मजिस्ट्रेट को अर्ज़ी दें, जो पुलिस को जाँच का आदेश दे सकते हैं।</p><div class="cite">BNSS s.175(3)</div>`},
  {cls:"coral hi",html:`<div class="kick">अपना सवाल पूछें</div><div class="grow"></div><div class="big-cta">Nyaya से पूछें।<br>धारा भी,<br>फ़ैसला भी।</div><div class="pill">asknyaya.in · लिंक बायो में</div><div class="grow"></div><p style="font-size:32px;opacity:.75">यह शोध सहायता है, क़ानूनी सलाह नहीं। अपने मामले के लिए वकील से बात करें।</p>`}],
 myths:[
  {cls:"",html:`<div class="kick">Myth vs law</div><div class="grow"></div><h1>5 things<br>people get<br><em>wrong.</em></h1><div class="grow"></div><p class="mut">Each one checked against the section.</p>`},
  {cls:"",html:`<div class="kick">Myth 1</div><h2 class="q">“You can only file an FIR where it happened.”</h2><div class="rule"></div><div class="kick">The law</div><p>Any police station, wherever the offence happened. It's then sent to the right station.</p><div class="cite">BNSS s.173(1)</div>`},
  {cls:"",html:`<div class="kick">Myth 2</div><h2 class="q">“You have to pay for a copy of the FIR.”</h2><div class="rule"></div><div class="kick">The law</div><p>The copy is given free of cost, to the informant or the victim.</p><div class="cite">BNSS s.173(2)</div>`},
  {cls:"",html:`<div class="kick">Myth 3</div><h2 class="q">“Bail is always up to the judge.”</h2><div class="rule"></div><div class="kick">The law</div><p>For a bailable offence, bail is your right once you give bail or a bond.</p><div class="cite">BNSS s.478</div>`},
  {cls:"",html:`<div class="kick">Myth 4</div><h2 class="q">“Police can hold you as long as they like.”</h2><div class="rule"></div><div class="kick">The law</div><p>You must be taken before a Magistrate within 24 hours, not counting travel time. Longer needs the Magistrate's order.</p><div class="cite">BNSS s.58 · Art. 22(2)</div>`},
  {cls:"",html:`<div class="kick">Myth 5</div><h2 class="q">“The landlord can just change the locks.”</h2><div class="rule"></div><div class="kick">The law</div><p>Eviction goes through the court or rent authority. Lock-outs and cutting water or power are not the lawful route.</p><div class="cite">Your state's rent law sets the details</div>`},
  END()],
 quiz:[
  {cls:"",html:`<div class="kick">Student mode · quiz</div><div class="grow"></div><h1>Law quiz.<br>Can you get<br><em>4 out of 4?</em></h1><div class="grow"></div><p class="mut">Answer in your head, then swipe for the answer.</p>`},
  {cls:"",html:`<div class="kick">Question 1 · New codes</div><h2 class="q">A “zero FIR” means an FIR that:</h2><div class="opts"><p>A. Has no accused named</p><p>B. Can be filed at any police station, wherever the offence happened</p><p>C. Is filed with zero fee</p><p>D. Is closed without investigation</p></div>`},
  {cls:"light",html:`<div class="kick">Answer 1</div><h2>B. Any police station</h2><p>Information can be given irrespective of where the offence happened. The FIR then goes to the station with jurisdiction.</p><div class="cite">BNSS s.173(1)</div>`},
  {cls:"",html:`<div class="kick">Question 2 · Landmark cases</div><h2 class="q">The basic structure doctrine was laid down in:</h2><div class="opts"><p>A. Golaknath v. State of Punjab</p><p>B. Kesavananda Bharati v. State of Kerala</p><p>C. Minerva Mills v. Union of India</p><p>D. Indira Gandhi v. Raj Narain</p></div>`},
  {cls:"light",html:`<div class="kick">Answer 2</div><h2>B. Kesavananda Bharati</h2><p>1973: Parliament can amend the Constitution, but not its basic structure.</p><div class="cite">Amending power: Constitution Art. 368</div>`},
  {cls:"",html:`<div class="kick">Question 3 · Procedure</div><h2 class="q">A first-time offender held as an undertrial must be released on bond after serving:</h2><div class="opts"><p>A. One-half of the maximum sentence</p><p>B. One-third of the maximum sentence</p><p>C. One-quarter</p><p>D. Two-thirds</p></div>`},
  {cls:"light",html:`<div class="kick">Answer 3</div><h2>B. One-third</h2><p>One-third for first-time offenders, one-half for others. Not for offences punishable with death or life imprisonment.</p><div class="cite">BNSS s.479</div>`},
  {cls:"",html:`<div class="kick">Question 4 · Constitution</div><h2 class="q">Which Article did Dr Ambedkar call the "heart and soul" of the Constitution?</h2><div class="opts"><p>A. Article 14</p><p>B. Article 19</p><p>C. Article 21</p><p>D. Article 32</p></div>`},
  {cls:"light",html:`<div class="kick">Answer 4</div><h2>D. Article 32</h2><p>The right to move the Supreme Court to enforce fundamental rights.</p><div class="cite">Constitution Art. 32</div>`},
  {cls:"coral",html:`<div class="kick">35 questions in all</div><div class="grow"></div><div class="big-cta">Student mode<br>on Nyaya.</div><p style="margin-top:40px">Quiz, case briefs and a moot bench that argues back. Free.</p><div class="pill">asknyaya.in/students</div><div class="grow"></div><p style="font-size:30px;opacity:.75">For study and research, not legal advice.</p>`}],
 dv:[
  {cls:"",html:`<div class="kick">Your rights · at home</div><div class="grow"></div><h1>Abuse at home<br>isn't only<br><em>physical.</em></h1><div class="grow"></div><p class="mut">The law protects women against physical, sexual, verbal, emotional and economic abuse.</p>`},
  {cls:"",html:`<div class="num">1</div><h2>Cruelty is a crime</h2><p>Cruelty by a husband or his relatives, including harassment for dowry, is a crime. (This was IPC s.498A.)</p><div class="cite">BNS s.85</div>`},
  {cls:"",html:`<div class="num">2</div><h2>Orders you can ask for</h2><p>Under the Domestic Violence Act, you can ask a Magistrate for a protection order, a residence order, money for expenses and custody of children.</p><div class="cite">Protection of Women from Domestic Violence Act, 2005</div>`},
  {cls:"",html:`<div class="num">3</div><h2>The right to stay</h2><p>You have a right to live in the shared household, whether or not you own it.</p><div class="cite">Protection of Women from Domestic Violence Act, 2005</div>`},
  {cls:"",html:`<div class="num">4</div><h2>Someone to help you file</h2><p>A Protection Officer in your district can help you file and find shelter, medical help and legal aid.</p>`},
  {cls:"light",html:`<div class="kick">Get help now</div><h2>112 · 181 · 15100</h2><p>In danger now: call <b>112</b>.<br>Women's helpline: <b>181</b>.<br>Free legal aid: <b>15100</b>.</p>`},
  END()],
};
